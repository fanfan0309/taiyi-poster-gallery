<style>
:root{color-scheme:dark;--bg:#121419;--panel:#1a1d24;--edge:#3b3541;--gold:#f0d5a0;--text:#f5efe5;--muted:#c8bbb6;--font:system-ui,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font)}
main{max-width:1180px;margin:auto;padding:clamp(16px,4vw,48px)}
header{padding:0 0 20px;border-bottom:1px solid var(--edge)}
h1{margin:0;color:var(--gold);font:700 clamp(2rem,6vw,3.5rem)/1.25 Georgia,"Songti SC",serif;letter-spacing:.04em}
header p{margin:6px 0 0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 0}
input,button{font:inherit;color:inherit;border:1px solid var(--edge);background:var(--panel);border-radius:6px;min-height:44px}
input{flex:1 1 220px;min-width:0;padding:8px 12px}
button{cursor:pointer}
.filter,dialog button{padding:0 12px}
.filter[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
output{color:var(--muted);margin-left:auto}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gallery{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(39vw,170px),1fr));gap:12px}
.card{width:100%;display:block;text-align:left;padding:0;overflow:hidden}
.card:hover{border-color:var(--gold)}
.card img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain;background:#24232a}
.caption{display:flex;gap:7px;align-items:baseline;padding:8px 10px;flex-wrap:wrap}
.caption strong{color:var(--text)}
.caption small{color:var(--muted)}
dialog{background:var(--panel);color:var(--text);padding:0;border:1px solid var(--edge);border-radius:8px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px)}
dialog form{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px 4px 12px}
dialog::backdrop{background:#000d}
dialog img{display:block;width:auto;height:auto;max-width:min(580px,calc(100vw - 22px));max-height:calc(100dvh - 76px);object-fit:contain}
@media(max-width:420px){.controls output{margin-left:0}.caption{gap:4px;padding:7px}.gallery{gap:8px}}
</style>
</head>

<main>
  <header><h1>千机神枢·太一</h1><p>153 位器灵 · 15改海报图册</p></header>
  <div class="controls">
    <input id="search" type="search" aria-label="搜索姓名或编号" placeholder="搜索姓名或编号">
    <button class="filter" type="button" data-group="all" aria-pressed="true">全部</button>
    <button class="filter" type="button" data-group="main" aria-pressed="false">本篇</button>
    <button class="filter" type="button" data-group="dlc" aria-pressed="false">域外 DLC</button>
    <output id="count" aria-live="polite">153 位</output>
  </div>
  <ul class="gallery" id="gallery"></ul>
  <p id="empty" hidden>没有找到对应的器灵。</p>
  <dialog id="preview" aria-labelledby="preview-title">
    <form method="dialog"><strong id="preview-title"></strong><button type="submit" autofocus>关闭</button></form>
    <img id="preview-image" alt="">
  </dialog>
</main>

<script>
'use strict';
const cards = JSON.parse(document.getElementById('data').textContent);
const gallery = document.getElementById('gallery');
const search = document.getElementById('search');
const preview = document.getElementById('preview');
const big = document.getElementById('preview-image');
const filters = [...document.querySelectorAll('[data-group]')];
let active = 'all';
let opener;
const rows = cards.map(({id,name,image}, index) => {
  const row = document.createElement('li');
  const button = document.createElement('button');
  button.className = 'card';
  button.type = 'button';
  button.setAttribute('aria-haspopup','dialog');
  const picture = document.createElement('img');
  picture.alt = '';
  picture.width = 512;
  picture.height = 768;
  picture.loading = index < 4 ? 'eager' : 'lazy';
  picture.decoding = 'async';
  picture.src = image;
  const caption = document.createElement('span');
  caption.className = 'caption';
  const title = document.createElement('strong');
  title.textContent = name;
  const number = document.createElement('small');
  number.textContent = id;
  caption.append(title,number);
  button.append(picture,caption);
  button.addEventListener('click',()=>{
    opener = button;
    document.getElementById('preview-title').textContent = name;
    big.alt = name + '海报';
    big.src = picture.src;
    preview.showModal();
  });
  row.append(button);
  return row;
});
gallery.append(...rows);
function filter(){
  const query = search.value.trim().toLowerCase();
  let total = 0;
  rows.forEach((row,index) => {
    const {id,name} = cards[index];
    const group = id.startsWith('DLC-') ? 'dlc' : 'main';
    row.hidden = !(active === 'all' || active === group) || !(name.toLowerCase().includes(query) || id.toLowerCase().includes(query));
    if (!row.hidden) total++;
  });
  document.getElementById('count').textContent = total + ' 位';
  document.getElementById('empty').hidden = total !== 0;
}
search.addEventListener('input',filter);
filters.forEach(button=>button.addEventListener('click',()=>{
  active = button.dataset.group;
  filters.forEach(filterButton=>filterButton.setAttribute('aria-pressed',String(filterButton===button)));
  filter();
}));
preview.addEventListener('click',event=>{if(event.target===preview)preview.close()});
preview.addEventListener('close',()=>{
  big.removeAttribute('src');
  opener?.focus({preventScroll:true});
});
</script>
